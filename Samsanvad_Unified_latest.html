margin-left: 25px;

function toggleSettingsSidebar(event) {
  event.stopPropagation(); // Prevent bubbling to document
  const sidebar = document.getElementById("settingsSidebar");
  sidebar.classList.toggle("visible");
}




function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);
}

document.getElementById("themeToggle")?.addEventListener("change", (e) => {
  applyTheme(e.target.value);
});

window.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem("theme") || "light";
  applyTheme(savedTheme);
  document.getElementById("themeToggle").value = savedTheme;
});

 	
    function uploadDocument() {
  // ✅ Grab the correct file input element
  const fileInput = document.getElementById("uploadFile");
  const vectorModeSelect = document.getElementById("vectorModeSelect");

  // 🧠 Safely extract values
  const file = fileInput?.files?.[0];
  const vectorMode = vectorModeSelect?.value?.trim() || "single";

  // 🛡️ Defensive check
  if (!file) {
    alert("Please select a file before uploading.");
    return;
  }

  // 📦 Prepare FormData payload
  const formData = new FormData();
  formData.append("file", file);
  formData.append("vectorMode", vectorMode);

  // 🧪 Diagnostic preview
  console.log("Uploading file:", file.name);
  console.log("Selected vector mode:", vectorMode);
  for (let pair of formData.entries()) {
    console.log(`${pair[0]}: ${pair[1]}`);
  }

  // 🚀 Dispatch to backend
  fetch("/upload", {
    method: "POST",
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      console.log("Server response:", data);
      alert(data.message);
    })
    .catch(err => {
      console.error("Upload failed:", err);
      alert("Upload failed. Check console for details.");
    });
}


   function startListening() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-IN";
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById("userInput").value = transcript;
    sendQuery();
  };

  recognition.onerror = (e) => {
    console.error("Speech recognition error:", e.error);
  };

  recognition.start();
}

function readLastResponse() {
	   const responseText = document.getElementById("response").innerText;

  	   const utterance = new SpeechSynthesisUtterance(responseText);
           utterance.lang = "en-IN";
           speechSynthesis.speak(utterance);
     }


function appendBotReply(text) {
  const replyDiv = document.createElement('div');
  replyDiv.className = 'botReply';

  // Create span for spoken text
  const spokenSpan = document.createElement('span');
  spokenSpan.className = 'spokenText';
  spokenSpan.textContent = text;

  // Create 🔊 button
  const speakBtn = document.createElement('button');
  speakBtn.textContent = '🔊';
  speakBtn.title = 'Read aloud';
  speakBtn.style.marginLeft = '8px';
  speakBtn.style.cursor = 'pointer';
  speakBtn.onclick = () => {
    const utterance = new SpeechSynthesisUtterance(spokenSpan.textContent);
    utterance.lang = "en-US";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  };

  // Append span and button to reply container
  replyDiv.appendChild(spokenSpan);
  replyDiv.appendChild(speakBtn);

  // Add to response area
  document.getElementById('response').appendChild(replyDiv);
}




function speakLatestResponse() {
  const responses = document.querySelectorAll(".spokenText");
  const latest = responses[responses.length - 1];
  if (!latest) return;

  const utterance = new SpeechSynthesisUtterance(latest.textContent);
  utterance.lang = "en-US"; // Customize language/voice as needed
  window.speechSynthesis.cancel(); // Stop any ongoing speech
  window.speechSynthesis.speak(utterance);
}



  function refreshFileList() {
   fetch("/files")
    .then(res => res.json())
    .then(data => {
      const dropdown = document.getElementById("fileDropdown");
      dropdown.innerHTML = ""; // Clear old entries
      data.files.forEach(file => {
        const option = document.createElement("option");
        option.value = file;
        option.textContent = file;
        dropdown.appendChild(option);
      });
    })
    .catch(err => {
      console.error("Failed to load files:", err);
      const dropdown = document.getElementById("fileDropdown");
      dropdown.innerHTML = "<option>⚠️ Error loading files</option>";
    });
}

if (event.key === "Escape") {

function sendQuery() {
  const query = document.getElementById("userInput")?.value?.trim();
  if (!query) return;

  const role = document.getElementById("role")?.value || "Assistant";
  const context = document.getElementById("context")?.value || "";
  const vectorMode = document.getElementById("vectorModeSelect").value;

  const responseBox = document.getElementById("response");

  // Append user message
  const userMessage = document.createElement("div");

  userMessage.style.marginBottom = "10px";
  responseBox.appendChild(userMessage);

  // Clear input field
  document.getElementById("userInput").value = "";

  fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, role, context, vectorMode })
  })
  .then(res => res.json())
  .then(data => {
    const botMessage = document.createElement("div");
botMessage.className = "botReply";
botMessage.style.borderLeft = "4px solid #6b8e23";

spokenSpan.className = "spokenText";
spokenSpan.textContent = data.response ?? "No response received.";

// 🔊 Button
const speakBtn = document.createElement("button");
speakBtn.textContent = "🔊";
speakBtn.title = "Read aloud";
speakBtn.style.marginLeft = "8px";
speakBtn.style.cursor = "pointer";
speakBtn.onclick = () => {
  const utterance = new SpeechSynthesisUtterance(spokenSpan.textContent);
  utterance.lang = "en-US";
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
};

speakBtn.style.border = "none";
speakBtn.style.background = "none";
speakBtn.style.padding = "0";
speakBtn.style.fontSize = "1.2rem"; // Optional: match icon size





// Assemble and append
botMessage.appendChild(roleLabel);
botMessage.appendChild(spokenSpan);
botMessage.appendChild(speakBtn);
responseBox.appendChild(botMessage);



    // Scroll to bottom
    responseBox.scrollTop = responseBox.scrollHeight;

    // ✅ Store response and context for slide generation
    window.chatResponseText = data.response;
    window.chatContextUsed = data.context_used;

    console.log("🧠 Stored chat response:", window.chatResponseText);
    console.log("📍 Stored context:", window.chatContextUsed);
  })
  .catch(err => console.error("Chat error:", err));

function submitWebsiteURL() {
  const url = document.getElementById("siteUrlInput").value.trim();
  const vectorMode = document.getElementById("vectorModeSelect").value;
  console.log("🔔 submitWebsiteURL triggered with:", url, vectorMode);

  if (!url) return alert("Please enter a valid URL.");

  fetch("/index_url", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url, vectorMode })
  })
  .then(res => res.json())
  .then(data => {
    alert(`✅ ${data.message}`);
  })
  .catch(err => {
    console.error("Indexing error:", err);
    alert("❌ Error while indexing. Check logs.");
  })
  .finally(() => {
    document.getElementById("waitOverlay").style.display = "none";  // Hide wait bar
  });
}

 function previewLogo(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('logo').src = e.target.result; // Live preview in header
  };
  reader.readAsDataURL(file);
}



function uploadLogo() {
  const fileInput = document.getElementById("logoInput");
  const file = fileInput.files[0];
  if (!file) {
    alert("⚠️ No file selected.");
    return;
  }

  const formData = new FormData();
  formData.append("logo", file);

  fetch("/upload_logo", {
    method: "POST",
    body: formData
  })
    .then(res => {
      if (res.ok) {
        // Force refresh to bypass browser cache
        document.getElementById("logo").src = "/static/logo6.jpg?" + new Date().getTime();
        alert("✅ Logo updated successfully.");
      } else {
        alert("❌ Upload failed.");
      }
    })
    .catch(err => {
      console.error("Upload error:", err);
      alert("❌ Upload failed.");
    });
}





function b64ToBlob(base64, mime) {
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length).fill().map((_, i) => byteChars.charCodeAt(i));
  const byteArray = new Uint8Array(byteNumbers);
  return new Blob([byteArray], { type: mime });
}


function generatePresentation() {
  const slideCount = parseInt(document.getElementById("slideCountInput")?.value) || 2;

  const final_response = window.chatResponseText;
  const context = window.chatContextUsed;

  const statusBox = document.getElementById("statusMessage");
  const statusText = document.getElementById("statusText");
  const okBtn = document.getElementById("statusOkBtn");

  const showStatus = (message) => {
    statusText.innerText = message;
    statusBox.style.display = "block";
    okBtn.onclick = () => {
      statusBox.style.display = "none";
    };
  };

  // 🔽 Inserted fetch block starts here
  fetch("/generate_ppt", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_json: {
        response: final_response,
        context_used: context
      },
      slide_count: slideCount
    })
  })
    .then(async res => {
      const raw = await res.text();
      console.log("📦 Raw response:", raw);

      try {
        const data = JSON.parse(raw);
        console.log("✅ Parsed JSON:", data);

        if (data.status === "success") {
          showStatus(`✅ Presentation saved.\n📂 Location: ${data.path}`);
          showGeneratedPPT(data.path);
        } else {
          showStatus(`❌ ${data.message}`);
        }
      } catch (err) {
        console.error("❌ JSON parse failed:", err);
        showStatus("⚠️ Server returned invalid response.");
      }
    })
    .catch(err => {
      console.error("❌ Fetch failed:", err);
      showStatus("⚠️ Server error during slide generation.");
    });
}

    .then(res => res.json())

    })

      updateDropdown(["⚠️ Error loading files"]);
    });
}

function updateDropdown(files) {
  const dropdown = document.getElementById("fileDropdown");
  dropdown.innerHTML = "";

  });

function showGeneratedPPT(pptPath) {
  const panel = document.getElementById("pptPreviewPanel");
  const content = document.getElementById("pptPreviewContent");

  // Clear previous content
  content.innerHTML = "";

  // Create download link
  const link = document.createElement("a");
  link.href = pptPath;
  link.innerText = "📥 Download Presentation";
  link.download = pptPath.split("/").pop();
  link.style.display = "block";
  link.style.marginBottom = "12px";

  // Optional: Show file name
  const fileName = document.createElement("div");
  fileName.innerText = `File: ${pptPath.split("/").pop()}`;
  fileName.style.fontSize = "14px";
  fileName.style.color = "#555";

  content.appendChild(link);
  content.appendChild(fileName);

  // Show panel
  panel.style.display = "block";
}

function uploadQueryDocument() {

  }

  const formData = new FormData();
  formData.append("file", queryFile);
  formData.append("documentType", "query"); // Optional metadata for backend routing

  fetch("/upload", {
    method: "POST",
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      alert(data.message || "✅ Query document uploaded successfully.");
      queryInput.value = ""; // Clear selection
    })
    .catch(err => {
      console.error("Upload failed:", err);
      alert("❌ Upload failed.");
    });
}
